<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>WebGL Fluid Simulation</title>
        <script src="dat.gui.min.js"></script>
        <style>
            * {
                user-select: none;
            }

            html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
            }

            body {
                position: fixed;
                inset: 0;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            .dg {
                opacity: 0.9;
            }

            .dg .property-name {
                overflow: visible;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script src="./script.js"></script>
    </body>
</html>
